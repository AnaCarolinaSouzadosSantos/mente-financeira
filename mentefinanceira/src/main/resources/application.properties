# ==========================================
# CONFIGURAÇÃO DO BANCO DE DADOS H2
# ==========================================
spring.application.name=mentefinanceira

# URL de conexão do banco em memória
spring.datasource.url=jdbc:h2:mem:mentefinanceiradb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Dialeto do Hibernate para H2
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Habilita o console do H2 no navegador (http://localhost:8080/h2-console)
spring.h2.console.enabled=true

# Cria/Atualiza as tabelas automaticamente com base nos @Entity
spring.jpa.hibernate.ddl-auto=update

# Mostra os comandos SQL gerados no terminal (ótimo para debugar)
spring.jpa.show-sql=true