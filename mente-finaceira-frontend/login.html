<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mente Financeira - Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="cadastro-container">
        <div class="cadastro-header">
            <h2>🧠 Mente Financeira</h2>
            <p>Seja bem-vindo de volta! Faça seu login.</p>
        </div>

        <form id="formLogin">
            <div class="input-group">
                <label for="email">E-mail</label>
                <input type="email" id="email" placeholder="seu@email.com" required>
            </div>

            <div class="input-group">
                <label for="senha">Senha</label>
                <input type="password" id="senha" placeholder="Digite sua senha" required>
            </div>

            <button type="submit" class="btn-cadastrar">Entrar</button>
            
            <p style="text-align: center; margin-top: 15px; font-size: 14px; color: #64748b;">
                Não tem conta? <a href="cadastro.html" style="color: #10b981; text-decoration: none; font-weight: bold;">Cadastre-se</a>
            </p>
        </form>
    </div>
    <script src="script.js"></script>

</body>
</html>
