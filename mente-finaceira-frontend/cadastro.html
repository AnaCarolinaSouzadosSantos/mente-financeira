<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mente Financeira - Criar Perfil</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="cadastro-container">
        <div class="cadastro-header">
            <h2>🧠 Mente Financeira</h2>
            <p>Monte o seu perfil e personalize o seu controle de gastos</p>
        </div>

        <form id="formCadastro">
            <div class="input-group">
                <label for="nome">Nome Completo</label>
                <input type="text" id="nome" placeholder="Digite seu nome" required>
            </div>

            <div class="input-group">
                <label for="email">E-mail</label>
                <input type="email" id="email" placeholder="seu@email.com" required>
            </div>

            <div class="input-group">
                <label for="senha">Senha</label>
                <input type="password" id="senha" placeholder="Crie uma senha forte" required>
            </div>

            <div class="input-group">
                <label for="renda">Renda Mensal (Salário líquido)</label>
                <input type="number" id="renda" placeholder="R$ 0,00" min="0" step="0.01" required>
            </div>

            <div class="input-group">
                <label for="objetivo">Qual seu maior objetivo financeiro?</label>
                <select id="objetivo" required>
                    <option value="" disabled selected>Selecione um objetivo</option>
                    <option value="economizar">Quero economizar e criar uma reserva</option>
                    <option value="dividas">Quero sair das dívidas</option>
                    <option value="investir">Quero aprender a investir</option>
                    <option value="controlar">Apenas monitorar meus gastos diários</option>
                </select>
            </div>

            <button type="submit" class="btn-cadastrar">Criar meu Perfil</button>
        </form>
    </div>

</body>
</html>
